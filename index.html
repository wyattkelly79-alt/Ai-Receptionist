<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Memory</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #17202a;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 230px;
  background: #111827;
  color: white;
  padding: 28px 18px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 35px;
}

.logo span {
  color: #60a5fa;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.nav button {
  background: transparent;
  color: #cbd5e1;
  border: none;
  text-align: left;
  padding: 13px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 15px;
}

.nav button:hover,
.nav button.active {
  background: #1f2937;
  color: white;
}

/* MAIN */
.main {
  margin-left: 230px;
  padding: 35px;
  max-width: 1400px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.topbar h1 {
  font-size: 30px;
}

.topbar p {
  color: #667085;
  margin-top: 5px;
}

.account {
  background: white;
  padding: 10px 15px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

/* ASK */
.ask {
  background: linear-gradient(135deg, #111827, #243247);
  color: white;
  padding: 30px;
  border-radius: 18px;
  margin-bottom: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

.ask h2 {
  font-size: 25px;
  margin-bottom: 7px;
}

.ask p {
  color: #cbd5e1;
  margin-bottom: 20px;
}

.askbox {
  display: flex;
  gap: 10px;
}

.askbox input {
  flex: 1;
  padding: 15px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button.primary {
  background: #2563eb;
  color: white;
  border: none;
  padding: 14px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

button.primary:hover {
  background: #1d4ed8;
}

/* CARDS */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 25px;
}

.stat {
  background: white;
  padding: 22px;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
}

.stat-number {
  font-size: 30px;
  font-weight: bold;
  margin-top: 8px;
}

.stat-label {
  color: #667085;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #e5e7eb;
}

.card h3 {
  margin-bottom: 18px;
}

/* FORMS */
input,
textarea {
  width: 100%;
  padding: 13px;
  margin-bottom: 12px;
  border: 1px solid #d0d5dd;
  border-radius: 9px;
  font-size: 15px;
}

textarea {
  height: 110px;
  resize: vertical;
}

.file-label {
  display: block;
  padding: 13px;
  background: #f3f4f6;
  border-radius: 9px;
  margin-bottom: 15px;
  cursor: pointer;
  text-align: center;
}

.file-label input {
  display: none;
}

/* JOBS */
.search {
  margin-bottom: 15px;
}

.job {
  border: 1px solid #e5e7eb;
  padding: 17px;
  border-radius: 11px;
  margin-bottom: 10px;
}

.job h4 {
  font-size: 17px;
  margin-bottom: 7px;
}

.job p {
  color: #667085;
  margin: 4px 0;
}

.empty {
  text-align: center;
  color: #98a2b3;
  padding: 30px;
}

/* ANSWER */
.answer {
  background: white;
  color: #17202a;
  margin-top: 18px;
  padding: 18px;
  border-radius: 10px;
  display: none;
}

/* MOBILE */
@media(max-width: 800px) {

  .sidebar {
    position: static;
    width: 100%;
    padding: 15px;
  }

  .logo {
    margin-bottom: 10px;
  }

  .nav {
    flex-direction: row;
    overflow-x: auto;
  }

  .main {
    margin-left: 0;
    padding: 20px;
  }

  .stats,
  .grid {
    grid-template-columns: 1fr;
  }

  .topbar {
    align-items: flex-start;
  }

  .askbox {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">
    Job<span>Memory</span>
  </div>

  <div class="nav">
    <button class="active">⌂ Dashboard</button>
    <button>▣ Jobs</button>
    <button>♙ Customers</button>
    <button>▤ Documents</button>
    <button>⚙ Settings</button>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div>
      <h1>Dashboard</h1>
      <p>Your company's memory, organized.</p>
    </div>

    <div class="account">
      Your Business
    </div>
  </div>

  <!-- AI SEARCH -->
  <div class="ask">

    <h2>Ask your business anything.</h2>

    <p>
      Search your jobs, customers, notes and project history.
    </p>

    <div class="askbox">

      <input
        id="question"
        placeholder="Example: What did we do for John Smith?"
      >

      <button class="primary" onclick="askMemory()">
        Ask
      </button>

    </div>

    <div id="answer" class="answer"></div>

  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <div class="stat-label">Total Jobs</div>
      <div class="stat-number" id="jobCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Customers</div>
      <div class="stat-number" id="customerCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Information Stored</div>
      <div class="stat-number">Ready</div>
    </div>

  </div>

  <div class="grid">

    <!-- ADD JOB -->
    <div class="card">

      <h3>＋ Add a Job</h3>

      <input
        id="customer"
        placeholder="Customer name"
      >

      <input
        id="project"
        placeholder="Project name"
      >

      <input
        id="location"
        placeholder="Location"
      >

      <textarea
        id="notes"
        placeholder="Job notes, materials, measurements, prices..."
      ></textarea>

      <label class="file-label">
        📷 Add job photos
        <input
          id="photos"
          type="file"
          accept="image/*"
          multiple
          onchange="previewPhotos()"
        >
      </label>

      <div id="photoPreview"></div>

      <button
        class="primary"
        onclick="saveJob()"
      >
        Save Job
      </button>

    </div>

    <!-- JOBS -->
    <div class="card">

      <h3>Your Jobs</h3>

      <input
        class="search"
        id="search"
        placeholder="Search your jobs..."
        oninput="displayJobs()"
      >

      <div id="jobs"></div>

    </div>

  </div>

</div>

<script>

let jobs =
  JSON.parse(localStorage.getItem("jobMemoryJobs")) || [];


/* SAVE JOB */

function saveJob() {

  const customer =
    document.getElementById("customer").value.trim();

  const project =
    document.getElementById("project").value.trim();

  const location =
    document.getElementById("location").value.trim();

  const notes =
    document.getElementById("notes").value.trim();

  if (!customer || !project) {

    alert("Please enter a customer and project.");

    return;
  }

  const job = {

    customer,
    project,
    location,
    notes,

    date:
      new Date().toLocaleDateString()

  };

  jobs.push(job);

  localStorage.setItem(
    "jobMemoryJobs",
    JSON.stringify(jobs)
  );

  document.getElementById("customer").value = "";
  document.getElementById("project").value = "";
  document.getElementById("location").value = "";
  document.getElementById("notes").value = "";
  document.getElementById("photos").value = "";

  document.getElementById("photoPreview").innerHTML = "";

  displayJobs();

  alert("Job saved successfully.");
}


/* DISPLAY JOBS */

function displayJobs() {

  const container =
    document.getElementById("jobs");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  container.innerHTML = "";

  const filtered =
    jobs.filter(job =>

      job.customer.toLowerCase().includes(search) ||

      job.project.toLowerCase().includes(search) ||

      job.location.toLowerCase().includes(search) ||

      job.notes.toLowerCase().includes(search)

    );

  if (filtered.length === 0) {

    container.innerHTML =
      '<div class="empty">No jobs found.</div>';

  } else {

    filtered.forEach(job => {

      const div =
        document.createElement("div");

      div.className = "job";

      div.innerHTML = `

        <h4>${escapeHTML(job.project)}</h4>

        <p>
          <strong>Customer:</strong>
          ${escapeHTML(job.customer)}
        </p>

        <p>
          <strong>Location:</strong>
          ${escapeHTML(job.location)}
        </p>

        <p>
          ${escapeHTML(job.notes)}
        </p>

        <p>
          <small>Added ${escapeHTML(job.date)}</small>
        </p>

      `;

      container.appendChild(div);

    });

  }

  updateStats();
}


/* STATS */

function updateStats() {

  document.getElementById("jobCount")
    .textContent = jobs.length;

  const customers =
    new Set(
      jobs.map(job => job.customer.toLowerCase())
    );

  document.getElementById("customerCount")
    .textContent = customers.size;
}


/* ASK MEMORY */

function askMemory() {

  const question =
    document.getElementById("question")
      .value
      .toLowerCase();

  const answer =
    document.getElementById("answer");

  if (!question) return;

  const words =
    question.split(/\s+/);

  const matches =
    jobs.filter(job => {

      const text =
        (
          job.customer +
          " " +
          job.project +
          " " +
          job.location +
          " " +
          job.notes
        ).toLowerCase();

      return words.some(word =>
        word.length > 2 &&
        text.includes(word)
      );

    });

  if (matches.length) {

    answer.innerHTML =
      "<strong>I found:</strong><br><br>" +

      matches.map(job =>

        `<strong>${escapeHTML(job.project)}</strong>
        — ${escapeHTML(job.customer)}
        <br>
        ${escapeHTML(job.location)}
        <br>
        ${escapeHTML(job.notes)}`

      ).join("<br><br>");

  } else {

    answer.innerHTML =
      "I couldn't find anything matching that question yet.";

  }

  answer.style.display = "block";
}


/* PHOTO PREVIEW */

function previewPhotos() {

  const files =
    document.getElementById("photos").files;

  const preview =
    document.getElementById("photoPreview");

  preview.innerHTML =
    "<p style='margin-bottom:10px;color:#667085;'>Photos selected:</p>";

  for (const file of files) {

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        const img =
          document.createElement("img");

        img.src =
          event.target.result;

        img.style.width = "80px";
        img.style.height = "80px";
        img.style.objectFit = "cover";
        img.style.borderRadius = "8px";
        img.style.marginRight = "8px";
        img.style.marginBottom = "10px";

        preview.appendChild(img);

      };

    reader.readAsDataURL(file);
  }
}


/* SECURITY */

function escapeHTML(text) {

  return text

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


displayJobs();

</script>

</body>
</html>
