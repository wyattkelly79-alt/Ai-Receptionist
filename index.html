<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadLine AI - AI Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
    }

    .header p {
      margin-top: 6px;
      color: #cbd5e1;
    }

    .chat-container {
      max-width: 650px;
      margin: 35px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .business {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .business h2 {
      font-size: 20px;
    }

    .business p {
      color: #6b7280;
      margin-top: 4px;
    }

    #chat {
      height: 420px;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 14px;
      max-width: 80%;
      line-height: 1.4;
    }

    .ai {
      background: #eef2ff;
      margin-right: auto;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #e5e7eb;
      padding: 12px;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      padding: 13px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #374151;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>LeadLine AI</h1>
    <p>Your 24/7 AI Receptionist</p>
  </div>

  <div class="chat-container">

    <div class="business">
      <h2>Kelly Contracting</h2>
      <p>Ask us about your next project.</p>
    </div>

    <div id="chat">
      <div class="message ai">
        Hi! 👋 I'm Kelly Contracting's AI receptionist. 
        How can I help you today?
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        onkeydown="handleKey(event)"
      >

      <button onclick="sendMessage()">Send</button>
    </div>

    <div class="footer">
      Powered by LeadLine AI
    </div>

  </div>

  <script>

    let conversationStep = 0;

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {

      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(() => {

        let response;

        if (conversationStep === 0) {

          response =
            "Absolutely! I'd be happy to help. What type of project are you looking to have done?";

          conversationStep = 1;

        } else if (conversationStep === 1) {

          response =
            "Great. About how large is the project, and what town or area is the property located in?";

          conversationStep = 2;

        } else if (conversationStep === 2) {

          response =
            "Thanks! What's your name and the best phone number for the contractor to contact you?";

          conversationStep = 3;

        } else {

          response =
            "Perfect. I've recorded your information. A member of the team will review your request and contact you as soon as possible. 👍";

          conversationStep = 4;

        }

        addMessage(response, "ai");

      }, 700);
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

  </script>

</body>
</html>
